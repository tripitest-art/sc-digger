name: Aufgabe für einen Agenten
description: Klar abgegrenzte Aufgabe, die ein Worker-Agent in einem Pull Request umsetzen kann
labels: ["worker-task"]
body:
  - type: markdown
    attributes:
      value: |
        Ein Issue ist der Vertrag mit dem Worker. Je genauer Schnittstellen und
        Akzeptanztests, desto weniger rät der Worker. Ablauf: `AGENTS.md`, Abschnitt
        „Worker-Aufgaben“.

  - type: textarea
    id: ziel
    attributes:
      label: Ziel
      description: Was soll danach anders sein? Ein, zwei Sätze.
    validations:
      required: true

  - type: textarea
    id: dateien
    attributes:
      label: Betroffene Dateien
      description: |
        Nur diese Dateien dürfen geändert werden (plus alles unter tests/). Ein Pfad pro
        Listenpunkt, am Anfang des Punkts. Der CI-Check `acceptance-guard` prüft das.
      placeholder: |
        - `sc_digger/organize.py`: write_tags
        - `tests/test_analysis_organize.py`: eigene Tests
    validations:
      required: true

  - type: textarea
    id: schnittstellen
    attributes:
      label: Schnittstellen
      description: Neue oder geänderte Funktionen mit exakter Signatur, Rückgabewert und Verhalten im Fehlerfall.
      render: python
      placeholder: |
        def write_loudness_tags(path: Path, report: QualityReport) -> bool:
            """True, wenn geschrieben wurde; False (kein Fehler) bei nicht taggbarem Format."""
    validations:
      required: true

  - type: textarea
    id: nicht-anfassen
    attributes:
      label: Nicht Teil dieser Aufgabe
      description: Was ausdrücklich nicht geändert oder „gleich mit aufgeräumt“ wird.
      placeholder: |
        - kein Refactoring in main.py außer der Übergabe-Zeile
        - Audio wird nicht verändert
    validations:
      required: true

  - type: textarea
    id: akzeptanztests
    attributes:
      label: Akzeptanztests
      description: |
        pytest-Code, den der Worker 1:1 als `tests/acceptance/test_issue_<Nummer>.py`
        übernimmt. Der CI-Check `acceptance-guard` vergleicht die Datei mit diesem Block.
        Netzwerk nur über Fakes. Leer lassen, wenn es keine festen Akzeptanztests gibt.
      render: python
    validations:
      required: false

  - type: textarea
    id: fertig
    attributes:
      label: Fertig, wenn
      value: |
        - [ ] Akzeptanztests grün
        - [ ] Weitere Tests decken das neue Verhalten ab (Netzwerk nur über Fakes)
    validations:
      required: true

  - type: dropdown
    id: main-py
    attributes:
      label: Berührt sc_digger/main.py
      description: main.py ist der Engpass (AGENTS.md, Regel 8). Bei „ja“ zusätzlich Label `berührt-main.py` setzen.
      options:
        - nein
        - ja
    validations:
      required: true

  - type: dropdown
    id: merge-modus
    attributes:
      label: Merge-Modus
      description: Automatisch = Reviewer-Agent merged bei grünem CI. Manuell = Reviewer gibt frei, Stephan merged.
      options:
        - automatisch nach Review
        - manuell durch Stephan (Betrieb, Dateien, Zugangsdaten, Downloads)
    validations:
      required: true

  - type: textarea
    id: kontext
    attributes:
      label: Kontext
      description: ROADMAP-Abschnitt, Logs, Beispiele, Abhängigkeiten. Keine Zugangsdaten.
    validations:
      required: false
