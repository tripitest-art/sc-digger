name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System-Pakete (ffmpeg für Qualitäts- und Analyse-Tests, fpcalc für Fingerprints)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 libchromaprint-tools

      - name: Python-Pakete
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Keine Zugangsdaten im Repo
        run: |
          if git grep -n -E 'bot[0-9]{6,}:[A-Za-z0-9_-]{30,}|(TELEGRAM_BOT_TOKEN|SOUNDCLOUD_AUTH_TOKEN)=[^[:space:]]+' -- . ':!AGENTS.md' ':!.env.example'; then
            echo "::error::Möglicher Token im Repo gefunden (siehe oben)."
            exit 1
          fi

  # Der pre-push-Hook auf dem Worker-Server läuft als root und ruft `python -m pytest -q`.
  # Dieser Job prüft denselben Befehl mit denselben Abhängigkeiten: sonst fällt erst der
  # Push aus, wenn ein Test nur als root scheitert (#324).
  tests-als-root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: System-Pakete (die Suite braucht sie auch als root)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1 libchromaprint-tools

      - name: Python-Pakete
        run: pip install -r requirements.txt pytest

      - name: Tests als root (Umgebung des pre-push-Hooks)
        run: sudo -E "$(command -v python)" -m pytest -q
