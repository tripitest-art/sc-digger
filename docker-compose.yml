services:
  sc-digger:
    build: .
    restart: unless-stopped
    init: true                     # räumt Zombie-Prozesse der Cron-Jobs ab
    env_file: .env                 # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SOUNDCLOUD_AUTH_TOKEN
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /music/Schranz:/music/Schranz:ro             # Sammlung, nur lesend (NFS-Mount des LXC)
      - /music/inbox:/music/inbox                    # geprüfte Downloads (NFS-Mount des LXC)
      - ./data:/data                                 # State-DB
