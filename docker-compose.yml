services:
  sc-digger:
    build: .
    restart: unless-stopped
    init: true                     # räumt Zombie-Prozesse der Cron-Jobs ab
    env_file: .env                 # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SOUNDCLOUD_AUTH_TOKEN
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /music/Schranz:/music/Schranz:ro             # Sammlung, nur lesend (NFS-Mount des LXC)
      - /music/inbox:/music/inbox                    # geprüfte Downloads (NFS-Mount des LXC)
      - ./data:/data                                 # State-DB
    # Web-Statusseite: nur aktiv, wenn SC_DIGGER_WEB_PASSWORD in .env gesetzt ist.
    # Der Konfigeditor ist dann standardmäßig an (Override-Datei /data/config.local.yaml,
    # geschrieben wird nie in die versionierte config.yaml). Nur für einen abweichenden Pfad:
    #   SC_DIGGER_CONFIG_LOCAL: /data/config.local.yaml
    # Port-Freigabe nur an die LAN-Adresse des Hosts (nicht 0.0.0.0):
    # ports:
    #   - "192.168.1.10:8080:8080"
