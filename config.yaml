# sc-digger Konfiguration

search:
  # Genre-Tags, die pro Lauf durchsucht werden
  tags:
    - schranz
    - hardtechno
    - industrial techno
    - hard techno
  # BPM-Fenster (SoundCloud liefert bpm nur, wenn der Uploader es setzt;
  # fehlende BPM werden NICHT aussortiert, sondern per Titel/Tag geschätzt)
  bpm_min: 150
  bpm_max: 165
  bpm_unknown_policy: keep   # keep | drop
  # Nur Tracks der letzten N Tage
  max_age_days: 14
  # Maximale Track-Dauer in Minuten für discover (längere sind DJ-Sets und werden aussortiert)
  max_duration_min: 12
  # Pro Tag maximal so viele Treffer abrufen
  limit_per_tag: 100
  # Zusätzliche Quellen: Uploads von Künstlern/Labels, denen du folgst
  # (leer lassen, bis konkrete Profile feststehen)
  followed_users: []
  # Reposts & Likes von Referenz-DJs/Accounts, deren Geschmack du vertraust.
  # Bessere Signalqualität als reine Tag-Suche, weil Tags oft mit Promo-Spam
  # verwässert sind. Treffer von hier bekommen einen Scoring-Bonus (reference_boost).
  reference_accounts:
    # Modern & Neo-Schranz (155-165+ BPM, R-Label/Outworld/Unreal-Umfeld)
    - https://soundcloud.com/kobosil
    - https://soundcloud.com/xnikolina
    - https://soundcloud.com/noisesbyneongraveyard
    - https://soundcloud.com/klangkuenstler
    - https://soundcloud.com/inverruf
    - https://soundcloud.com/kukomusic
    - https://soundcloud.com/somewhen-1
    - https://soundcloud.com/bentechy
    - https://soundcloud.com/triptykh
    - https://soundcloud.com/rikhter
    - https://soundcloud.com/wndrlstt
    # Schranz-Puristen & Brückenbauer (Loop- & Hard-Schranz)
    - https://soundcloud.com/svetec
    - https://soundcloud.com/obihardtechno
    - https://soundcloud.com/claudi-17
    - https://soundcloud.com/viperxxl
    - https://soundcloud.com/sepromatiq
    - https://soundcloud.com/jasonlittleofficial
    - https://soundcloud.com/danielahaverbeck
    # Classic Schranz (2000er Original-Sound)
    - https://soundcloud.com/svenwittekind
    - https://soundcloud.com/robertnatus
    - https://soundcloud.com/frank-kvitta
    - https://soundcloud.com/boris-s
    - https://soundcloud.com/arkus-p
    - https://soundcloud.com/marioranieri
    - https://soundcloud.com/felix-kroecher
    # Labels & Plattformen
    - https://soundcloud.com/outworld
    - https://soundcloud.com/technogermany
    - https://soundcloud.com/gotec76
    # R-Label Group bewusst weggelassen (Handle nicht auffindbar, Kobosil deckt
    # als eigener Referenz-Account einen Teil davon ab)
  reference_limit: 50

scoring:
  # Genre-relative Bewertung: Perzentil innerhalb der aktuellen Kandidatenmenge.
  # Absolute Schwellen sind bei Underground-Genres unzuverlässig.
  min_plays: 300
  min_like_ratio: 0.01        # harte Untergrenze, damit Spam rausfliegt
  min_percentile: 40          # Score muss im oberen 60 % der Kandidaten liegen
  weights:
    like_ratio: 0.45
    repost_ratio: 0.35
    comment_ratio: 0.10
    recency: 0.10
  # Bonus auf den Score (Punkte auf der 0-100-Perzentil-Skala), wenn ein Track
  # von einem reference_accounts-Profil gerepostet/geliked wurde.
  reference_boost: 15

download:
  # Ordner mit deiner bestehenden Sammlung (für Duplikat-Check)
  collection_dir: /music/Schranz
  # Zielordner für automatisch geladene, geprüfte Tracks
  inbox_dir: /music/inbox
  # Gates werden NUR erkannt und gemeldet, nie automatisch durchlaufen.
  # true: nur native SoundCloud-Originale laden; false schaltet Cloud-Downloads ein
  auto_download_native_only: true
  # Maximale Dateigröße für Cloud-Downloads (MB)
  cloud_max_mb: 500

organize:
  # Heruntergeladene Tracks in der Inbox nach BPM/Key sortieren (nie im Archiv)
  enabled: true
  # BPM-Bucket-Größe für Ordnerstruktur (z.B. 5 -> 150-155, 155-160)
  bpm_bucket_size: 5
  # Standard-Genre für Tags
  default_genre: Schranz
  # Audio-Analyse: BPM und Key via librosa erkennen
  detect_bpm: true
  detect_key: true
  # Oktav-Korrektur: Audio-BPM wird per ×2/÷2 bevorzugt ins Suchfenster (search.bpm_min/max)
  # geholt, sonst in diesen Genre-Bereich. Eine Uploader-Angabe im Text hat Vorrang.
  bpm_plausible_min: 120
  bpm_plausible_max: 200
  # ID3/Vorbis-Tags automatisch schreiben (Artist, Title, BPM, Key, Genre, URL)
  write_tags: true

quality:
  accepted_lossless: [wav, aiff, aif, flac]
  min_mp3_bitrate_kbps: 320
  # Fake-Check: Spektrum-Cutoff. Echte 320er reichen bis ~20 kHz.
  min_cutoff_hz_for_320: 19000
  min_cutoff_hz_for_lossless: 19500
  # Lautheits-/Clipping-Check (EBU R128): sehr viele Hard-Techno-Free-DLs sind
  # brickwall-gemastert. Landet bei Überschreitung in _rejected/clipped/, nicht
  # im normalen _rejected/ (das ist für Fake-Bitrate reserviert).
  # Kalibriert an Stephans eigener Sammlung (2026-09-19): dort liegen akzeptierte
  # Tracks bei LRA 3.4-10 LU und True Peak 0 bis +2 dBFS (Inter-Sample-Peaks über
  # 0 dBFS sind im Genre normal). LUFS allein ist deshalb kein brauchbares Kriterium,
  # LRA (Dynamikumfang) ist das zuverlässigere Brickwall-Signal.
  min_loudness_range_lu: 2.5
  max_true_peak_dbfs: 3.0

fingerprint:
  # Neue Downloads am Klang (Chromaprint) mit der Sammlung abgleichen; Treffer -> _rejected/duplicate/
  check_downloads: true

state:
  db_path: /data/seen.sqlite
  track_db_path: /data/tracks.sqlite  # Lokale SQLite-DB (nie auf NFS, da WAL-Modus)

health:
  # Alarm per Telegram, wenn so viele discover-Läufe in Folge scheitern oder 0 Rohtreffer
  # (vor Filtern) liefern. Bei täglichem Cron: 2 = Alarm am zweiten stillen Tag.
  alert_after_bad_runs: 2

telegram:
  # Werte kommen aus Umgebungsvariablen TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  max_items_per_digest: 25
  # Inline-Buttons (👍/👎/⏳) unter jeder Digest-Nachricht zur Track-Bewertung
  feedback_buttons: true

rekordbox:
  # Rekordbox-XML-Export: schreibt eine XML mit Playlists pro Woche in die Inbox
  xml_enabled: true
  xml_path: /music/inbox/sc-digger.xml
  # Pfad-Mapping: Server-Pfad -> Laptop-Pfad (aus Sicht von Rekordbox)
  path_map:
    /music/inbox: "Z:/Highres/_sc-digger-inbox"

digest:
  kaufliste_max_items: 30   # Maximale Einträge in der wöchentlichen Kaufliste

